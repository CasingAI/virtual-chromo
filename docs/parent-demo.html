<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>virtual-chromo 父项目 Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar button {
      padding: 6px 12px;
      border: 0;
      border-radius: 4px;
      background: #0f3460;
      color: #eee;
      cursor: pointer;
    }
    .toolbar button:hover { background: #1a4a7a; }
    .toolbar button:disabled { opacity: 0.4; cursor: default; }
    #urlInput {
      flex: 1;
      min-width: 200px;
      padding: 6px 10px;
      border: 1px solid #0f3460;
      border-radius: 4px;
      background: #0d1b2a;
      color: #eee;
    }
    #status {
      padding: 4px 8px;
      font-size: 12px;
      color: #94a3b8;
      background: #0d1b2a;
      border-bottom: 1px solid #0f3460;
    }
    #main {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    #frameWrap {
      flex: 1;
      min-width: 0;
    }
    #chromo {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    #devtoolsPanel {
      width: 360px;
      border-left: 1px solid #0f3460;
      background: #0d1b2a;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #devtoolsTabs {
      display: flex;
      border-bottom: 1px solid #0f3460;
    }
    #devtoolsTabs button {
      flex: 1;
      padding: 8px 6px;
      border: 0;
      background: transparent;
      color: #64748b;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #devtoolsTabs button.is-active {
      color: #38bdf8;
      box-shadow: inset 0 -2px 0 #38bdf8;
    }
    .devtools-pane {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .devtools-pane[hidden] {
      display: none !important;
    }
    .devtools-pane h2 {
      margin: 0;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      border-bottom: 1px solid #0f3460;
    }
    #consoleList,
    #networkList {
      flex: 1;
      overflow: auto;
      padding: 6px;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .console-entry {
      margin-bottom: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #16213e;
      word-break: break-word;
    }
    .console-entry .meta {
      color: #64748b;
      margin-bottom: 2px;
    }
    .console-entry.level-warn { border-left: 3px solid #f59e0b; }
    .console-entry.level-error { border-left: 3px solid #ef4444; }
    .console-entry.level-info { border-left: 3px solid #38bdf8; }
    .console-entry.level-debug { border-left: 3px solid #64748b; }
    .network-entry {
      margin-bottom: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #16213e;
      word-break: break-word;
    }
    .network-entry.is-failed { border-left: 3px solid #ef4444; }
    .network-entry.is-bypass { border-left: 3px solid #f59e0b; }
    .network-entry .meta {
      color: #94a3b8;
      margin-bottom: 2px;
    }
    .network-entry .url {
      color: #cbd5e1;
    }
    .network-entry.is-selected {
      outline: 1px solid #38bdf8;
    }
    .network-detail {
      padding: 6px 8px;
      font-size: 10px;
      color: #94a3b8;
      border-top: 1px solid #0f3460;
      word-break: break-all;
      min-height: 48px;
    }
    #screenshotPanel {
      border-top: 1px solid #0f3460;
      padding: 8px;
      background: #0d1b2a;
    }
    #screenshotPanel h3 {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }
    #screenshotPreview {
      display: block;
      max-width: 100%;
      max-height: 200px;
      border: 1px solid #0f3460;
      background: #fff;
    }
    #screenshotMeta {
      margin-top: 4px;
      font-size: 10px;
      color: #64748b;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="btnBack" type="button" title="后退">←</button>
    <button id="btnForward" type="button" title="前进">→</button>
    <button id="btnReload" type="button" title="刷新">↻</button>
    <input id="urlInput" type="text" value="https://example.com" placeholder="输入 URL 后按 Enter" spellcheck="false">
    <button id="btnGo" type="button">前往</button>
    <button id="btnEval" type="button" title="在子页面执行 document.title">Eval</button>
    <button id="btnLog" type="button" title="在子页面 console.log">Log</button>
    <button id="btnAlert" type="button" title="在子页面 alert（应被 noop）">Alert</button>
    <button id="btnScreenshot" type="button" title="VC_SCREENSHOT">截图</button>
    <button id="btnClearState" type="button" title="VC_CLEAR_STATE">清状态</button>
    <label style="display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12px;color:#cbd5e1;white-space:nowrap" title="VC_DEBUG_OPTIONS navProbe：抑制 VC_CLICK/LOCATION/HISTORY，改发 VC_DEBUG_NAV">
      <input id="chkNavProbe" type="checkbox" /> 导航探针
    </label>
    <label style="display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12px;color:#cbd5e1;white-space:nowrap" title="VC_DEBUG_OPTIONS frameBustGuard：默认吞掉 open(_top)。关掉以便测 AST">
      <input id="chkFrameBust" type="checkbox" checked /> 吞破框
    </label>
  </div>
  <div id="status">等待 virtual-chromo 就绪…</div>
  <div id="main">
    <div id="frameWrap">
      <iframe
        id="chromo"
        src="http://localhost:8787/viewer"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
      ></iframe>
    </div>
    <aside id="devtoolsPanel">
      <div id="devtoolsTabs">
        <button type="button" class="is-active" data-tab="console">Console</button>
        <button type="button" data-tab="network">Network</button>
      </div>
      <div class="devtools-pane" data-pane="console">
        <h2>VC_CONSOLE_UPDATED + READ</h2>
        <div id="consoleList"></div>
      </div>
      <div class="devtools-pane" data-pane="network" hidden>
        <h2>VC_NETWORK_UPDATED + READ</h2>
        <div id="networkList"></div>
        <div id="networkDetail" class="network-detail">点击行查看完整 URL</div>
      </div>
      <div id="screenshotPanel">
        <h3>Screenshot（VC_SCREENSHOT）</h3>
        <img id="screenshotPreview" alt="screenshot preview" hidden>
        <div id="screenshotMeta">点击工具栏「截图」</div>
      </div>
    </aside>
  </div>

  <script>
    (function () {
      'use strict'

      const iframe = document.getElementById('chromo')
      const urlInput = document.getElementById('urlInput')
      const statusEl = document.getElementById('status')
      const consoleList = document.getElementById('consoleList')
      const networkList = document.getElementById('networkList')
      const networkDetail = document.getElementById('networkDetail')
      const devtoolsTabs = document.getElementById('devtoolsTabs')
      const btnBack = document.getElementById('btnBack')
      const btnForward = document.getElementById('btnForward')
      const btnReload = document.getElementById('btnReload')
      const btnGo = document.getElementById('btnGo')
      const btnEval = document.getElementById('btnEval')
      const btnLog = document.getElementById('btnLog')
      const btnAlert = document.getElementById('btnAlert')
      const btnScreenshot = document.getElementById('btnScreenshot')
      const screenshotPreview = document.getElementById('screenshotPreview')
      const screenshotMeta = document.getElementById('screenshotMeta')
      const btnClearState = document.getElementById('btnClearState')
      const chkNavProbe = document.getElementById('chkNavProbe')
      const chkFrameBust = document.getElementById('chkFrameBust')

      let ready = false
      let navProbe = false
      let frameBustGuard = true
      let currentUrl = ''
      let lastConsoleId = ''
      let lastNetworkId = ''
      let networkPullTimer = null
      /** @type {Set<string>} */
      const networkSeenIds = new Set()
      const DEFAULT_RPC_TIMEOUT = 30000

      function post(cmd, payload) {
        if (!iframe.contentWindow) return
        const msg = payload === undefined ? [cmd] : [cmd, payload]
        iframe.contentWindow.postMessage(msg, '*')
      }

      function vcRpc(resultCmd, cmd, payload, options) {
        const timeout = (options && options.timeout) || DEFAULT_RPC_TIMEOUT
        return new Promise(function (resolve, reject) {
          const id = crypto.randomUUID()
          let settled = false
          let timer

          function finish(fn, arg) {
            if (settled) return
            settled = true
            clearTimeout(timer)
            window.removeEventListener('message', onResult)
            fn(arg)
          }

          timer = setTimeout(function () {
            finish(reject, Object.assign(new Error(cmd + ' timed out'), {
              code: 'RPC_TIMEOUT',
              id: id,
              timeout: timeout,
            }))
          }, timeout)

          function onResult(event) {
            if (event.source !== iframe.contentWindow) return
            if (!Array.isArray(event.data)) return
            const resCmd = event.data[0]
            const resPayload = event.data[1]
            if (resCmd !== resultCmd || !resPayload || resPayload.id !== id) return
            if (resPayload.ok) {
              finish(resolve, resPayload.value)
            } else {
              const err = new Error(
                resPayload.error && resPayload.error.message || cmd + ' failed',
              )
              Object.assign(err, resPayload.error || {})
              finish(reject, err)
            }
          }

          window.addEventListener('message', onResult)
          post(cmd, Object.assign({ id: id }, payload || {}))
        })
      }

      function vcEval(code, options) {
        return vcRpc('VC_EVAL_RESULT', 'VC_EVAL', { code: code }, options)
      }

      function vcConsoleRead(after) {
        const payload = {}
        if (after) {
          payload.after = after
        }
        return vcRpc('VC_CONSOLE_READ_RESULT', 'VC_CONSOLE_READ', payload)
      }

      function vcNetworkRead(after) {
        const payload = {}
        if (after) {
          payload.after = after
        }
        return vcRpc('VC_NETWORK_READ_RESULT', 'VC_NETWORK_READ', payload)
      }

      function formatBytes(n) {
        if (!n) return '0'
        if (n < 1024) return n + ' B'
        return (n / 1024).toFixed(1) + ' KB'
      }

      function networkName(url) {
        try {
          const u = new URL(url)
          return u.pathname === '/' ? u.host : u.pathname
        } catch {
          return url
        }
      }

      function vcScreenshot(options) {
        return vcRpc(
          'VC_SCREENSHOT_RESULT',
          'VC_SCREENSHOT',
          options || {},
          { timeout: 60000 },
        )
      }

      function appendConsoleEntries(entries) {
        if (!entries || !entries.length) return
        for (let i = 0; i < entries.length; i++) {
          const entry = entries[i]
          const el = document.createElement('div')
          el.className = 'console-entry level-' + (entry.level || 'log')
          const meta = document.createElement('div')
          meta.className = 'meta'
          meta.textContent = entry.level + ' · ' + new Date(entry.ts).toLocaleTimeString()
          const body = document.createElement('div')
          body.textContent = (entry.args || []).join(' ')
          el.appendChild(meta)
          el.appendChild(body)
          consoleList.appendChild(el)
          if (entry.id) {
            lastConsoleId = entry.id
          }
        }
        consoleList.scrollTop = consoleList.scrollHeight
      }

      function pullConsoleDelta() {
        if (!ready) return Promise.resolve()
        return vcConsoleRead(lastConsoleId)
          .then(function (value) {
            if (value && value.entries && value.entries.length) {
              appendConsoleEntries(value.entries)
            }
            if (value && value.latestId) {
              lastConsoleId = value.latestId
            }
          })
          .catch(function (err) {
            console.error('[virtual-chromo console read]', err)
          })
      }

      function appendNetworkEntries(entries) {
        if (!entries || !entries.length) return
        for (let i = 0; i < entries.length; i++) {
          const entry = entries[i]
          if (entry.id && networkSeenIds.has(entry.id)) {
            // Upsert: skip duplicate rows from full resync (demo keeps first snapshot).
            continue
          }
          if (entry.id) {
            networkSeenIds.add(entry.id)
          }
          const el = document.createElement('div')
          el.className = 'network-entry'
          if (entry.failed) el.classList.add('is-failed')
          if (entry.bypass) el.classList.add('is-bypass')
          const meta = document.createElement('div')
          meta.className = 'meta'
          meta.textContent =
            (entry.method || 'GET') +
            ' ' +
            (entry.status || '-') +
            ' · ' +
            (entry.type || '') +
            ' · ' +
            formatBytes(entry.size) +
            ' · ' +
            (entry.duration || 0) +
            'ms' +
            (entry.bypass ? ' · bypass' : '')
          const body = document.createElement('div')
          body.className = 'url'
          body.textContent = networkName(entry.url || '')
          el.appendChild(meta)
          el.appendChild(body)
          el.addEventListener('click', function () {
            networkList.querySelectorAll('.network-entry.is-selected').forEach(function (n) {
              n.classList.remove('is-selected')
            })
            el.classList.add('is-selected')
            networkDetail.textContent = entry.url || ''
          })
          networkList.appendChild(el)
          if (entry.id) {
            lastNetworkId = entry.id
          }
        }
        networkList.scrollTop = networkList.scrollHeight
      }

      function pullNetworkDelta(opts) {
        if (!ready) return Promise.resolve()
        const full = opts && opts.full
        // full: omit after → bridge returns from buffer start (id-upsert safe).
        const after = full ? '' : lastNetworkId
        return vcNetworkRead(after)
          .then(function (value) {
            if (
              !full &&
              value &&
              (!value.entries || !value.entries.length) &&
              value.latestId &&
              value.latestId !== lastNetworkId &&
              !networkList.querySelector('.network-entry')
            ) {
              // Cursor desync with empty UI — resync once without after.
              return pullNetworkDelta({ full: true })
            }
            if (value && value.entries && value.entries.length) {
              appendNetworkEntries(value.entries)
            }
            if (value && value.latestId) {
              lastNetworkId = value.latestId
            }
          })
          .catch(function (err) {
            console.error('[virtual-chromo network read]', err)
          })
      }

      function scheduleNetworkPull() {
        if (networkPullTimer) {
          clearTimeout(networkPullTimer)
        }
        networkPullTimer = setTimeout(function () {
          networkPullTimer = null
          pullNetworkDelta()
        }, 50)
      }

      devtoolsTabs.addEventListener('click', function (event) {
        const btn = event.target.closest('button[data-tab]')
        if (!btn) return
        const tab = btn.getAttribute('data-tab')
        devtoolsTabs.querySelectorAll('button').forEach(function (b) {
          b.classList.toggle('is-active', b === btn)
        })
        document.querySelectorAll('.devtools-pane').forEach(function (pane) {
          pane.hidden = pane.getAttribute('data-pane') !== tab
        })
        if (tab === 'network') {
          pullNetworkDelta()
        }
      })

      function setStatus(text) {
        statusEl.textContent = text
      }

      function navigate(url) {
        if (!ready) {
          setStatus('virtual-chromo 尚未就绪')
          return
        }
        post('VC_NAVIGATE', { url: url })
      }

      const NAV_DEDUP_MS = 2000
      /** @type {Map<string, number>} */
      const navDedup = new Map()

      function canonicalNavUrl(url) {
        const raw = String(url || '').trim()
        if (!raw) return ''
        try {
          const u = new URL(raw)
          let path = u.pathname
          if (path.length > 1 && path.endsWith('/')) {
            path = path.slice(0, -1)
          }
          return u.origin + path + u.search + u.hash
        } catch {
          return raw
        }
      }

      function isSameTabOpenTarget(target) {
        const t = String(target || '').toLowerCase()
        return t === '_top' || t === '_self' || t === '_parent'
      }

      function resolveNavIntent(kind, payload) {
        const method = String((payload && payload.method) || '').toLowerCase()
        const target = payload && payload.target
        const url = String((payload && (payload.url || payload.href)) || '').trim()
        const key = [kind, method, target || '', canonicalNavUrl(url)].join('|')
        const now = Date.now()
        const prev = navDedup.get(key)
        if (prev !== undefined && now - prev < NAV_DEDUP_MS) {
          return { action: 'ignore', reason: 'duplicate' }
        }
        navDedup.set(key, now)

        if (kind === 'LOCATION' && method === 'open') {
          if (isSameTabOpenTarget(target)) {
            if (currentUrl && canonicalNavUrl(url) === canonicalNavUrl(currentUrl)) {
              return { action: 'ignore', reason: 'frame-bust same url' }
            }
            return { action: 'sameTab', url: url, reason: 'open same-tab target' }
          }
          if (String(target || '').toLowerCase() === '_blank' || !target) {
            return { action: 'ignore', reason: 'demo: no multi-tab UI' }
          }
          return { action: 'sameTab', url: url, reason: 'open named window' }
        }

        if (kind === 'CLICK') {
          return { action: 'ignore', reason: 'wait for VC_HISTORY' }
        }

        if (method === 'reload') {
          return { action: 'reload', reason: 'reload' }
        }

        if (!url) {
          return { action: 'ignore', reason: 'no url' }
        }
        return { action: 'sameTab', url: url, reason: 'location' }
      }

      window.addEventListener('message', function (event) {
        if (event.source !== iframe.contentWindow) return
        if (!Array.isArray(event.data)) return

        const cmd = event.data[0]
        const payload = event.data[1]

        switch (cmd) {
          case 'VC_READY':
            ready = true
            navProbe = !!(chkNavProbe && chkNavProbe.checked)
            frameBustGuard = chkFrameBust ? !!chkFrameBust.checked : true
            post('VC_DEBUG_OPTIONS', {
              navProbe: navProbe,
              frameBustGuard: frameBustGuard,
            })
            setStatus(
              '已就绪 v' +
                (payload && payload.version || '?') +
                ' build ' +
                (payload && payload.build || '?') +
                ' — 输入 URL 后按 Enter 或点「前往」',
            )
            break
          case 'VC_CLEAR_STATE_DONE':
            setStatus('浏览状态已清空（cookie / storage / 网络缓存）')
            break
          case 'VC_NAVIGATING':
            setStatus('即将加载 ' + (payload && payload.url || ''))
            break
          case 'VC_NAVIGATED':
            currentUrl = payload && payload.url || ''
            urlInput.value = currentUrl
            btnBack.disabled = !(payload && payload.canGoBack)
            btnForward.disabled = !(payload && payload.canGoForward)
            setStatus((payload && payload.title || currentUrl) || '已加载')
            break
          case 'VC_LOADING':
            if (payload && payload.loading) {
              setStatus('加载中… ' + (payload.url || ''))
            }
            break
          case 'VC_LOAD_FAILED':
            setStatus(
              '加载失败: ' +
              (payload && payload.message || payload && payload.code || 'unknown'),
            )
            console.error('[virtual-chromo load failed]', payload)
            if (payload && typeof payload.networkCount === 'number' && payload.networkCount > 0) {
              console.warn(
                '[virtual-chromo] load failed with networkCount=%s — full network pull',
                payload.networkCount,
              )
            }
            // Failure path never gets VC_NAVIGATED; resync network without after.
            pullNetworkDelta({ full: true })
            break
          case 'VC_ERROR':
            setStatus('错误: ' + (payload && payload.message || 'unknown'))
            console.error('[virtual-chromo]', payload)
            break
          case 'VC_PONG':
            setStatus('pong')
            break
          case 'VC_CONSOLE_UPDATED':
            pullConsoleDelta()
            break
          case 'VC_NETWORK_UPDATED':
            scheduleNetworkPull()
            break
          case 'VC_CLICK':
            setStatus(
              '点击: ' +
                (payload && payload.tagName || '?') +
                (payload && payload.href ? ' → ' + payload.href : '') +
                '（页内路由等 VC_HISTORY）',
            )
            break
          case 'VC_HISTORY':
            currentUrl = payload && payload.url || currentUrl
            urlInput.value = currentUrl
            setStatus(
              'SPA ' +
                (payload && payload.method || '?') +
                ': ' +
                (payload && payload.title || currentUrl),
            )
            break
          case 'VC_LOCATION': {
            const intent = resolveNavIntent('LOCATION', payload)
            setStatus(
              'location.' +
                (payload && payload.method || '?') +
                (payload && payload.target ? ' target=' + payload.target : '') +
                ': ' +
                (payload && payload.url || '') +
                ' → ' +
                intent.action +
                (intent.reason ? ' (' + intent.reason + ')' : ''),
            )
            if (intent.action === 'sameTab' && intent.url) {
              navigate(intent.url)
            } else if (intent.action === 'reload') {
              post('VC_RELOAD')
            }
            break
          }
          case 'VC_DEBUG_NAV':
            setStatus(
              '探针 ' +
                (payload && payload.kind || '?') +
                (payload && payload.method ? ' · ' + payload.method : '') +
                ': ' +
                (payload && (payload.url || payload.href) || '') +
                (payload && payload.stack && payload.stack.length
                  ? ' [' + payload.stack.length + ' frames]'
                  : ''),
            )
            console.info('[virtual-chromo navProbe]', payload)
            break
        }
      })

      function postDebugOptions() {
        post('VC_DEBUG_OPTIONS', {
          navProbe: navProbe,
          frameBustGuard: frameBustGuard,
        })
      }

      chkNavProbe.addEventListener('change', function () {
        navProbe = !!chkNavProbe.checked
        postDebugOptions()
        setStatus('导航探针: ' + (navProbe ? 'on' : 'off'))
      })

      if (chkFrameBust) {
        chkFrameBust.addEventListener('change', function () {
          frameBustGuard = !!chkFrameBust.checked
          postDebugOptions()
          setStatus('吞破框: ' + (frameBustGuard ? 'on' : 'off'))
        })
      }

      btnBack.addEventListener('click', function () { post('VC_BACK') })
      btnForward.addEventListener('click', function () { post('VC_FORWARD') })
      btnReload.addEventListener('click', function () { post('VC_RELOAD') })
      btnGo.addEventListener('click', function () {
        navigate(urlInput.value)
      })
      urlInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') navigate(urlInput.value)
      })
      btnEval.addEventListener('click', function () {
        if (!ready) {
          setStatus('virtual-chromo 尚未就绪')
          return
        }
        vcEval('document.title')
          .then(function (value) {
            setStatus('eval document.title => ' + JSON.stringify(value))
          })
          .catch(function (err) {
            setStatus('eval 失败: ' + err.message)
            console.error('[virtual-chromo eval]', err)
          })
      })
      btnLog.addEventListener('click', function () {
        if (!ready) {
          setStatus('virtual-chromo 尚未就绪')
          return
        }
        vcEval("console.log('hello from parent-demo', Date.now())")
          .then(function () {
            setStatus('已触发 console.log，等待 VC_CONSOLE_UPDATED…')
          })
          .catch(function (err) {
            setStatus('log 失败: ' + err.message)
          })
      })
      btnAlert.addEventListener('click', function () {
        if (!ready) {
          setStatus('virtual-chromo 尚未就绪')
          return
        }
        vcEval("alert('should be noop')")
          .then(function () {
            setStatus('已触发 alert（应被 noop），查看右侧 console')
          })
          .catch(function (err) {
            setStatus('alert 失败: ' + err.message)
          })
      })
      btnScreenshot.addEventListener('click', function () {
        if (!ready) {
          setStatus('virtual-chromo 尚未就绪')
          return
        }
        setStatus('截图中…')
        btnScreenshot.disabled = true
        vcScreenshot({ format: 'jpeg', quality: 0.72 })
          .then(function (value) {
            if (!value || !value.dataUrl) {
              setStatus('截图返回为空')
              return
            }
            screenshotPreview.src = value.dataUrl
            screenshotPreview.hidden = false
            screenshotMeta.textContent =
              (value.mime || '?') +
              ' ' +
              (value.width || '?') +
              '×' +
              (value.height || '?') +
              ' · base64 ' +
              (value.data ? value.data.length : 0) +
              ' chars'
            setStatus('截图完成')
          })
          .catch(function (err) {
            setStatus('截图失败: ' + err.message)
            console.error('[virtual-chromo screenshot]', err)
          })
          .finally(function () {
            btnScreenshot.disabled = false
          })
      })
      btnClearState.addEventListener('click', function () {
        if (!ready) {
          setStatus('virtual-chromo 尚未就绪')
          return
        }
        post('VC_CLEAR_STATE')
        setStatus('正在清空浏览状态…')
      })
    })()
  </script>
</body>
</html>
