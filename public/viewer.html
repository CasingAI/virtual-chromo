<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>virtual-chromo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    #content {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ccc;
      font: 14px/1.5 sans-serif;
      background: #111;
      z-index: 1;
    }
    #boot.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="boot">正在初始化代理…</div>
  <iframe
    id="content"
    title="virtual-chromo content"
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"
  ></iframe>

  <script src="/bridge.js"></script>
  <script>
    (function () {
      'use strict'

      const UPDATE_INTERVAL_MS = 15000
      const FOCUS_CHECK_MIN_MS = 60000
      const RELOAD_COOLDOWN_MS = 30000
      const boot = document.getElementById('boot')
      let reloadingForUpdate = false
      /** @type {string} */
      let knownBridgeTag = ''
      /** @type {number} */
      let lastCheckAt = 0
      /** @type {number} */
      let lastReloadAt = 0
      try {
        lastReloadAt = +sessionStorage._vc_reload_at || 0
      } catch (err) {
        // ignore
      }

      function hideBoot() {
        boot.classList.add('hidden')
      }

      function showBoot(message) {
        boot.textContent = message
        boot.classList.remove('hidden')
      }

      function reloadForUpdate() {
        if (reloadingForUpdate) {
          return
        }
        var now = Date.now()
        if (lastReloadAt && now - lastReloadAt < RELOAD_COOLDOWN_MS) {
          return
        }
        reloadingForUpdate = true
        lastReloadAt = now
        try {
          sessionStorage._vc_reload_at = String(now)
        } catch (err) {
          // ignore
        }
        location.reload()
      }

      function reloadAfterSwInstall() {
        var now = Date.now()
        try {
          var last = +sessionStorage._vc_sw_ts || 0
          sessionStorage._vc_sw_ts = now
          if (now - last < 100) {
            setTimeout(reloadAfterSwInstall, 5000)
            return
          }
        } catch (err) {
          // ignore
        }
        reloadForUpdate()
      }

      function onSwActive() {
        hideBoot()
        VirtualChromoBridge.swDidReady()
      }

      function onSwReady() {
        return navigator.serviceWorker.ready.then(function () {
          if (navigator.serviceWorker.controller) {
            onSwActive()
          } else {
            reloadAfterSwInstall()
          }
        })
      }

      /**
       * @param {ServiceWorkerRegistration} reg
       */
      function watchForUpdates(reg) {
        function checkSw() {
          reg.update().catch(function () {})
        }

        function checkBridgeAsset() {
          fetch('/bridge.js', { cache: 'no-store', method: 'GET' })
            .then(function (res) {
              if (!res.ok) {
                return
              }
              var etag = res.headers.get('etag') || ''
              var len = res.headers.get('content-length') || ''
              var headerTag = etag + '|' + len
              // Prefer header-only fingerprint when ETag or Content-Length exist.
              if (etag || len) {
                var headerFp = 'h:' + headerTag
                if (!knownBridgeTag) {
                  knownBridgeTag = headerFp
                  return res.body && typeof res.body.cancel === 'function'
                    ? res.body.cancel().catch(function () {})
                    : undefined
                }
                if (knownBridgeTag === headerFp) {
                  return res.body && typeof res.body.cancel === 'function'
                    ? res.body.cancel().catch(function () {})
                    : undefined
                }
                knownBridgeTag = headerFp
                reloadForUpdate()
                return res.body && typeof res.body.cancel === 'function'
                  ? res.body.cancel().catch(function () {})
                  : undefined
              }
              return res.text().then(function (body) {
                var fingerprint = 'b:' + body.length + ':' + body.slice(0, 64)
                if (!knownBridgeTag) {
                  knownBridgeTag = fingerprint
                  return
                }
                if (fingerprint !== knownBridgeTag) {
                  knownBridgeTag = fingerprint
                  reloadForUpdate()
                }
              })
            })
            .catch(function () {})
        }

        function checkAll(force) {
          var now = Date.now()
          if (!force && lastCheckAt && now - lastCheckAt < FOCUS_CHECK_MIN_MS) {
            return
          }
          lastCheckAt = now
          checkSw()
          checkBridgeAsset()
        }

        checkAll(true)
        setInterval(function () {
          checkAll(true)
        }, UPDATE_INTERVAL_MS)

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            checkAll(false)
          }
        })

        window.addEventListener('focus', function () {
          checkAll(false)
        })

        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' })
        }
        reg.addEventListener('updatefound', function () {
          var worker = reg.installing
          if (!worker) {
            return
          }
          worker.addEventListener('statechange', function () {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              // New SW installed; skipWaiting is already called in bundle install handler.
              // controllerchange will reload. If waiting sticks, nudge reload shortly.
              setTimeout(function () {
                if (reg.waiting) {
                  reloadForUpdate()
                }
              }, 1500)
            }
          })
        })
      }

      function registerServiceWorker() {
        if (!self.isSecureContext) {
          VirtualChromoBridge.emitError('本程序需要 HTTPS 站点', 'INSECURE')
          showBoot('需要 HTTPS 环境')
          return
        }
        if (!self.ReadableStream) {
          VirtualChromoBridge.emitError('请使用最新的 HTML5 浏览器', 'NO_STREAM')
          showBoot('浏览器不支持')
          return
        }

        const sw = navigator.serviceWorker
        if (!sw) {
          const ua = navigator.userAgent
          if (/Firefox/i.test(ua)) {
            VirtualChromoBridge.emitError('不支持 Firefox 隐身模式', 'NO_SW')
            showBoot('不支持 Firefox 隐身模式')
          } else if (/iPhone|iPad/i.test(ua)) {
            VirtualChromoBridge.emitError('iOS 上请使用 Safari 浏览器', 'NO_SW')
            showBoot('iOS 请使用 Safari')
          } else {
            VirtualChromoBridge.emitError('浏览器不支持 Service Worker', 'NO_SW')
            showBoot('不支持 Service Worker')
          }
          return
        }

        // Always register (even if a controller already exists) so we can call update().
        sw.register('/sw.js?b=20260728-v3')
          .then(function (reg) {
            watchForUpdates(reg)
            return onSwReady()
          })
          .catch(function (err) {
            const message = err && err.message ? err.message : String(err)
            VirtualChromoBridge.emitError(message, 'SW_REGISTER_FAILED')
            showBoot('Service Worker 注册失败')
          })
      }

      VirtualChromoBridge.init()
      registerServiceWorker()

      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!navigator.serviceWorker.controller) {
          return
        }
        reloadForUpdate()
      })
    })()
  </script>
</body>
</html>
