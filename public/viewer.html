<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>virtual-chromo</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    #content {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    #boot,
    #fatal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #ccc;
      font: 14px/1.5 system-ui, sans-serif;
      background: #111;
      z-index: 1;
    }
    #boot.hidden,
    #fatal.hidden {
      display: none;
    }
    #fatal {
      z-index: 2;
      background: #202124;
      color: #e8eaed;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #fatal .fatal-card {
      max-width: 420px;
    }
    #fatal h1 {
      margin: 0 0 12px;
      font: 600 20px/1.3 system-ui, sans-serif;
      color: #fff;
    }
    #fatal p {
      margin: 0 0 8px;
      white-space: pre-wrap;
      color: #bdc1c6;
      font: 13px/1.5 system-ui, sans-serif;
    }
    #fatal .fatal-meta {
      margin: 12px 0 20px;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #9aa0a6;
      text-align: left;
      background: #303134;
      border-radius: 6px;
      padding: 10px 12px;
    }
    #fatal button {
      border: 0;
      border-radius: 6px;
      padding: 10px 18px;
      background: #1a73e8;
      color: #fff;
      font: 600 13px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    #fatal button:hover {
      background: #1765cc;
    }
  </style>
</head>
<body>
  <div id="boot">正在初始化代理…</div>
  <div id="fatal" class="hidden" role="alertdialog" aria-labelledby="fatal-title" aria-describedby="fatal-msg">
    <div class="fatal-card">
      <h1 id="fatal-title">此页面已停止运行</h1>
      <p id="fatal-msg">版本不匹配，无法继续代理。</p>
      <div class="fatal-meta" id="fatal-meta"></div>
      <button type="button" id="fatal-reload">重新加载</button>
    </div>
  </div>
  <iframe
    id="content"
    name="vc-content"
    title="virtual-chromo content"
    sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads"
  ></iframe>

  <script src="/bridge.js"></script>
  <script>
    (function () {
      'use strict'

      const boot = document.getElementById('boot')
      const fatalEl = document.getElementById('fatal')
      const fatalMsg = document.getElementById('fatal-msg')
      const fatalMeta = document.getElementById('fatal-meta')
      const fatalReload = document.getElementById('fatal-reload')

      function hideBoot() {
        boot.classList.add('hidden')
      }

      function showBoot(message) {
        boot.textContent = message
        boot.classList.remove('hidden')
      }

      /**
       * @param {{ title?: string, message?: string, bridgeBuild?: string, swBuild?: string, code?: string }} info
       */
      function showFatal(info) {
        hideBoot()
        if (info && info.title) {
          document.getElementById('fatal-title').textContent = info.title
        }
        fatalMsg.textContent = (info && info.message) || '版本不匹配，无法继续代理。'
        var lines = []
        if (info && info.code) {
          lines.push('code: ' + info.code)
        }
        if (info && info.bridgeBuild) {
          lines.push('bridge: ' + info.bridgeBuild)
        }
        if (info && info.swBuild) {
          lines.push('SW: ' + info.swBuild)
        }
        fatalMeta.textContent = lines.join('\n')
        fatalEl.classList.remove('hidden')
      }

      window.__vcShowFatal = showFatal
      window.__vcShowBoot = showBoot
      fatalReload.addEventListener('click', function () {
        navigator.serviceWorker
          .getRegistration()
          .then(function (reg) {
            if (!reg) {
              return
            }
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' })
            }
            return reg.update().then(function () {
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' })
              }
            })
          })
          .catch(function () {
            // ignore — still reload below
          })
          .then(function () {
            location.reload()
          })
      })

      function reloadAfterSwInstall() {
        var now = Date.now()
        try {
          var last = +sessionStorage._vc_sw_ts || 0
          sessionStorage._vc_sw_ts = now
          if (now - last < 100) {
            setTimeout(reloadAfterSwInstall, 5000)
            return
          }
        } catch (err) {
          // ignore
        }
        location.reload()
      }

      function onSwActive() {
        hideBoot()
        VirtualChromoBridge.swDidReady()
      }

      function onSwReady() {
        return navigator.serviceWorker.ready.then(function () {
          if (navigator.serviceWorker.controller) {
            onSwActive()
          } else {
            reloadAfterSwInstall()
          }
        })
      }

      /**
       * @param {ServiceWorkerRegistration} reg
       */
      function watchForUpdates(reg) {
        if (reg.waiting) {
          reg.waiting.postMessage({ type: 'SKIP_WAITING' })
        }
        reg.addEventListener('updatefound', function () {
          var worker = reg.installing
          if (!worker) {
            return
          }
          worker.addEventListener('statechange', function () {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              // New SW installed; skipWaiting is called in bundle install handler.
              // bridge assertBuildCompatible on controllerchange will show Fatal UI.
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' })
              }
            }
          })
        })
      }

      function registerServiceWorker() {
        if (!self.isSecureContext) {
          VirtualChromoBridge.emitError('本程序需要 HTTPS 站点', 'INSECURE')
          showBoot('需要 HTTPS 环境')
          return
        }
        if (!self.ReadableStream) {
          VirtualChromoBridge.emitError('请使用最新的 HTML5 浏览器', 'NO_STREAM')
          showBoot('浏览器不支持')
          return
        }

        const sw = navigator.serviceWorker
        if (!sw) {
          const ua = navigator.userAgent
          if (/Firefox/i.test(ua)) {
            VirtualChromoBridge.emitError('不支持 Firefox 隐身模式', 'NO_SW')
            showBoot('不支持 Firefox 隐身模式')
          } else if (/iPhone|iPad/i.test(ua)) {
            VirtualChromoBridge.emitError('iOS 上请使用 Safari 浏览器', 'NO_SW')
            showBoot('iOS 请使用 Safari')
          } else {
            VirtualChromoBridge.emitError('浏览器不支持 Service Worker', 'NO_SW')
            showBoot('不支持 Service Worker')
          }
          return
        }

        sw.register('/sw.js?b=20260728-v20')
          .then(function (reg) {
            watchForUpdates(reg)
            return onSwReady()
          })
          .catch(function (err) {
            const message = err && err.message ? err.message : String(err)
            VirtualChromoBridge.emitError(message, 'SW_REGISTER_FAILED')
            showBoot('Service Worker 注册失败')
          })
      }

      VirtualChromoBridge.init()
      registerServiceWorker()
    })()
  </script>
</body>
</html>
