<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新标签页</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      color: #5f6368;
      font: 14px/1.5 system-ui, -apple-system, sans-serif;
    }
    .blank {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 8px;
      font: 400 22px/1.3 system-ui, -apple-system, sans-serif;
      color: #202124;
    }
    p {
      margin: 0;
      color: #80868b;
    }
  </style>
</head>
<body>
  <div class="blank">
    <div>
      <h1>新标签页</h1>
      <p>在地址栏输入网址，按 Enter 开始浏览</p>
    </div>
  </div>
</body>
</html>
